<!DOCTYPE html>
<html lang="PL-pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Lab - Web App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>User panel</h1>
            <p>Web application test environment</p>
        </header>

        <main>
            <section class="card">
                <h2>Add new entry</h2>
                <form id="postForm">
                    <div class="form-group">
                        <label for="username">Autor:</label>
                        <input type="text" id="username" placeholder="Wpisz imię..." required>
                    </div>

                    <div class="form-group">
                        <label for="content">Message:</label>
                        <textarea id="content" rows="3" placeholder="Wpisz treść..." required></textarea>
                    </div>

                    <button type="submit">Publish</button>
                </form>
            </section>

            <section class="card">
                <h2>etwork diagnostics (Ping Tool)</h2>
                <form id="pingForm">
                    <div class="form-group">
                        <label for="pingTarget">IP address or domain:</label>
                        <input type="text" id="pingTarget" placeholder="np. 127.0.0.1" required>
                    </div>
                    <button type="submit">Check the connection</button>
                </form>
                <pre id="pingOutput"></pre>
            </section>

            <section class="card">
                <h2>System entries</h2>
                <div id="postsList">
                    <p class="empty-msg">Loading entries...</p>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
